[package]
name = "ftnl-backend-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Secure ephemeral cross-device file tunnel API"
repository = "https://github.com/file-tunnel/ftnl-backend-api.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
ftnl-lib-core = { git = "https://github.com/file-tunnel/ftnl-lib-core.git", rev = "a3b8be33cb70ffec0cf4547c338071654a7251ec" }
futures-util = "0.3"
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "64a4ee0ed839a8de7e9ba2588899a24e25b05a65" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
