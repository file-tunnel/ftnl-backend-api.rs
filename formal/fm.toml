schema_version = 1
project = "ftnl-backend-api"
model = "file-tunnel-protocol-v1"
language = "quint"
spec = "formal/file_tunnel_protocol.qnt"
main = "file_tunnel_protocol"
init = "init"
step = "step"
invariants = ["protocol_safety"]
witnesses = [
  "claim_reached",
  "ticket_redeemed_reached",
  "transfer_complete_reached",
  "terminal_phase_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
rust = "stable"
npx = "npx"

[execution]
timeout_seconds = 1200
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 32

[verification]
backend = "tlc"
exhaustive_finite_model = true
